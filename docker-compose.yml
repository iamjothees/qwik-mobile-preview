services:
  qwik-preview:
    image: iamjothees/qwik-mobile-preview:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwik-mobile-preview
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      - PORT=4567
      - HOST=0.0.0.0
      - HOST_IP=${HOST_IP:-}
    labels:
      - "com.qwik-preview.description=Qwik Mobile Preview LAN Relay Server"
