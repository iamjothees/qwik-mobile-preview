<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qwik Mobile Preview</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-title">
        <img src="../icons/icon-32.png" alt="Qwik Preview" class="logo">
        <span class="app-title">Qwik Mobile Preview</span>
      </div>
      <div id="server-status-pill" class="status-pill status-checking">
        <span class="dot"></span>
        <span id="server-status-text">Checking...</span>
      </div>
    </header>

    <!-- Main Active Preview Card -->
    <section class="card preview-card">
      <div class="url-info">
        <label class="section-label">Current Tab LAN URL</label>
        <div class="url-row">
          <input type="text" id="lan-url-input" class="url-input" readonly value="Detecting...">
          <button id="btn-copy-url" class="icon-btn" title="Copy URL">📋</button>
        </div>
      </div>

      <!-- Action Button -->
      <button id="btn-push-now" class="btn btn-primary push-btn">
        ⚡ Push to Mobile Now
      </button>

      <!-- QR Code Fallback & Switcher -->
      <div class="qr-container">
        <div class="qr-tabs">
          <button id="tab-qr-tab" class="qr-tab active">Tab URL</button>
          <button id="tab-qr-pair" class="qr-tab">Pair Phone 📲</button>
        </div>
        <div id="qrcode-box" class="qrcode-box">
          <canvas id="qr-canvas"></canvas>
        </div>
        <p id="qr-caption" class="qr-caption">Scan with phone camera to preview this tab</p>
      </div>
    </section>

    <!-- Mobile Receiver Info Card -->
    <section class="card receiver-info-card">
      <div class="receiver-header">
        <span class="section-label">Mobile Desk Receiver</span>
        <button id="btn-open-receiver" class="link-btn">Open Page ↗</button>
      </div>
      <div class="pairing-link-row">
        <input type="text" id="receiver-url-code" class="pair-link-input" readonly value="Detecting...">
        <button id="btn-copy-pair-link" class="icon-btn" title="Copy Mobile Link">📋</button>
      </div>
      <div class="pair-meta-row">
        <span>Room Key: <strong id="display-pair-key">qwik-...</strong></span>
      </div>
    </section>

    <!-- Settings Accordion -->
    <details class="settings-accordion">
      <summary class="settings-summary">⚙️ Preferences & Pairing Key</summary>
      <div class="settings-body">
        <div class="form-group">
          <label for="select-click-behavior">Toolbar Icon Click:</label>
          <select id="select-click-behavior" class="form-control">
            <option value="one_click">⚡ 1-Click Push directly (Instant)</option>
            <option value="popup">🔍 Open this Popup Dashboard</option>
          </select>
        </div>

        <div class="form-group">
          <label for="input-pair-key">Device Pairing Key:</label>
          <div class="pair-input-action-row">
            <input type="text" id="input-pair-key" class="form-control" placeholder="e.g. qwik-8x2k">
            <button id="btn-regen-pair-key" class="btn btn-regen" title="Generate New Pairing Key">🔄 New</button>
          </div>
          <small class="form-hint">Only phones with this key will receive your pushed tabs.</small>
        </div>

        <div class="form-group">
          <label for="input-server-url">Relay Server URL:</label>
          <input type="text" id="input-server-url" class="form-control" placeholder="http://localhost:4567">
        </div>

        <div class="form-group">
          <label for="select-network-interface">Network IP:</label>
          <select id="select-network-interface" class="form-control">
            <option value="auto">Auto-detect from server</option>
          </select>
        </div>

        <button id="btn-save-settings" class="btn btn-secondary">Save Preferences</button>
      </div>
    </details>

    <footer class="footer">
      <span>Shortcut: <kbd>Cmd+Shift+Q</kbd> or <kbd>Ctrl+Shift+Q</kbd></span>
    </footer>
  </div>

  <div id="toast" class="toast hidden">Copied to clipboard!</div>

  <script src="../lib/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
